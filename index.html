<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Section Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#76B900;--green-dark:#5a8c00;--black:#1A1A1A;--gray:#2a2a2a;--gray2:#333;--gray3:#444;
  --surface:#222;--surface2:#2a2a2a;--surface3:#333;--border:#404040;--border2:#555;
  --text:#f0f0f0;--text2:#aaa;--text3:#777;
  --accent:#76B900;--accent-bg:#1e2e00;--accent-text:#a8e000;
  --danger:#e05555;--danger-bg:#2e1010;--danger-text:#ff8080;
  --warn:#e0a020;--warn-bg:#2e2000;--warn-text:#ffc840;
  --success:#4caf50;--success-bg:#0e2010;--success-text:#80d880;
  --pro:#9b7fe8;--pro-bg:#1e1530;--pro-text:#c8aaff;
  --radius:8px;--font:'Segoe UI',system-ui,sans-serif;--mono:'Courier New',monospace;
}
body{background:var(--black);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
input,select,textarea,button{font-family:var(--font);font-size:13px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
select option{background:var(--surface2)}
button{cursor:pointer;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:7px 14px;transition:background .15s}
button:hover{background:var(--surface3)}
button.primary{background:var(--green);border-color:var(--green);color:#000;font-weight:600}
button.primary:hover{background:var(--green-dark)}
button.danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-text)}
button.small{padding:4px 10px;font-size:12px}
button.ghost{background:transparent;border-color:var(--border)}
.hidden{display:none!important}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px}
.sep{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.pill-open{background:var(--warn-bg);color:var(--warn-text)}
.pill-progress{background:var(--accent-bg);color:var(--accent-text)}
.pill-review{background:var(--pro-bg);color:var(--pro-text)}
.pill-done{background:var(--success-bg);color:var(--success-text)}
.pill-closed{background:#1a1a1a;color:var(--text3);border:1px solid var(--border)}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.field-row{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.field-label{color:var(--text2)}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.stat-card{background:var(--surface2);border-radius:var(--radius);padding:12px 16px}
.stat-num{font-size:26px;font-weight:700;margin-top:2px}
.meas-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--surface3);border:1px solid var(--border);border-radius:20px;padding:2px 9px;color:var(--text2);margin:2px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface3);border:1px solid var(--green);color:var(--accent-text);padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;display:none}
.notif-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:4px;vertical-align:middle}
.tab{padding:10px 16px;font-size:13px;font-weight:400;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;color:var(--text2);white-space:nowrap}
.tab.active{color:var(--green);border-bottom:2px solid var(--green);font-weight:600}
.tab:hover:not(.active){color:var(--text)}
.req-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.req-card:hover{border-color:var(--green)}
.reply-msg{padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6;margin-bottom:10px}
.reply-requester{background:var(--accent-bg);border:1px solid #2d4400}
.reply-analyst{background:var(--surface2);border:1px solid var(--border)}
.reply-other{background:var(--surface);border:1px solid var(--border)}
.msg-meta{font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.img-thumb{width:72px;height:54px;border-radius:6px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;overflow:hidden;position:relative}
.img-thumb:hover{border-color:var(--green)}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.diagram-option{border:2px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface);transition:border-color .15s;text-align:center}
.diagram-option:hover,.diagram-option.selected{border-color:var(--green)}
.diagram-option.selected{background:var(--accent-bg)}
.diagram-option svg{display:block;margin:0 auto 6px}
.xtool-active{background:var(--green)!important;color:#000!important;border-color:var(--green)!important;font-weight:700!important}
.xtool:hover{background:#333}
#tmpl-scroll::-webkit-scrollbar{height:4px}
#tmpl-scroll::-webkit-scrollbar-track{background:#1a1a1a}
#tmpl-scroll::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.diagram-option-label{font-size:11px;color:var(--text2);font-weight:500}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--gray)}
.tabs-bar{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--gray);overflow-x:auto}
.content{padding:20px;max-width:1100px;margin:0 auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border2)}
td{padding:9px 10px;border-bottom:1px solid var(--border)}
tr:hover td{background:#ffffff08}
.modal-overlay{position:fixed;inset:0;background:#000000cc;z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:24px;width:90%;max-width:460px}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black)}
.login-box{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:32px;width:380px;max-width:95vw}
.err{color:var(--danger-text);font-size:12px;margin-top:5px}
</style>
<link rel="stylesheet" href="workspace.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#76B900" opacity=".15" stroke="#76B900" stroke-width="1.5"/><text x="14" y="19" text-anchor="middle" font-size="15" fill="#76B900" font-family="monospace" font-weight="700">✂</text></svg>
      <div style="font-size:20px;font-weight:700;color:#76B900">X-Section Lab</div>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:24px">Process Lab · NVIDIA Israel</div>

    <div class="form-group" style="margin-bottom:12px">
      <div class="form-label">Your name</div>
      <input id="login-name" type="text" placeholder="Type your name or select below" autocomplete="off">
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px">Quick select</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px" id="quick-users"></div>

    <div id="pw-block" class="hidden">
      <div class="form-group" style="margin-bottom:12px">
        <div class="form-label">Password</div>
        <input id="login-pw" type="password" placeholder="Enter password">
      </div>
    </div>
    <div id="login-err" class="err hidden"></div>
    <button class="primary" style="width:100%;margin-top:4px" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="#76B900" opacity=".15" stroke="#76B900" stroke-width="1.2"/><text x="11" y="15.5" text-anchor="middle" font-size="12" fill="#76B900" font-family="monospace" font-weight="700">✂</text></svg>
      <span style="font-weight:700;font-size:18px;color:#76B900">X-Section Lab</span>
      <span style="font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-bg);color:var(--accent-text);font-weight:600">Shared requests</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="sync-status" style="font-size:11px;color:var(--text3)"></span>
      <div id="topbar-avatar" class="avatar"></div>
      <span id="topbar-name" style="font-size:13px;font-weight:600"></span>
      <span id="topbar-role" style="font-size:11px;color:var(--text3)"></span>
      <button class="small ghost" onclick="doLogout()">Change name</button>
    </div>
  </div>

  <div style="padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a style="color:var(--accent-text)" href="https://yousefmahajna.github.io/interconnect-process-lab/">Process Lab</a><label for="display-name">Your name</label><input id="display-name" style="width:180px" maxlength="80" onchange="setDisplayName(this.value)"><button class="small" onclick="downloadBackup()">Download backup</button><button class="small" onclick="retryShared()">Retry connection / save</button><a style="color:var(--text2)" href="shared-setup.html">Shared setup</a></div><div id="connection-error" role="alert" class="hidden" style="margin:12px 20px;padding:12px;border:1px solid var(--danger);color:var(--danger-text)"></div><div class="tabs-bar" id="tabs-bar">
    <button class="tab active" onclick="showView('dashboard')" id="tab-dashboard">Dashboard</button>
    <button class="tab" onclick="showView('new')" id="tab-new">＋ New request</button>
    <button class="tab" onclick="showView('requests')" id="tab-requests">All requests</button>
    <button class="tab hidden" onclick="showView('detail')" id="tab-detail">—</button>
    <button class="tab" onclick="showView('guide')" id="tab-guide">Process guide</button>
  </div>

  <div class="content">
    <div id="view-dashboard"></div>
    <div id="view-new" class="hidden"></div>
    <div id="view-requests" class="hidden"></div>
    <div id="view-detail" class="hidden"></div>
    <div id="view-guide" class="hidden"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="img-modal" class="modal-overlay hidden" onclick="closeImgModal()">
  <img id="img-modal-img" style="max-width:90vw;max-height:90vh;border-radius:10px;border:2px solid var(--green)" onclick="event.stopPropagation()">
</div>

<script src="firebase-config.js"></script>
<script src="firebase-auth.js"></script>
<script src="shared-auth.js"></script>
<script src="shared-store.js"></script>
<script>

const DIAGRAMS = DIAGRAM_GROUPS.flatMap(g => g.items);

function makeDiagramSVG(id, w, h) {
  w = w||90; h = h||62;
  const G="#76B900", R="#e05555", Y="#e0a020", B="#378ADD", P="#9b7fe8", T="#4caf50";
  const D="#333",S="#555",L="#888",BG="#222",LG="#1e2e00",OP="#1a1a2e";
  const V=`viewBox="0 0 90 62" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg"`;
  const svgs = {

standard:`<svg ${V}>
  <rect x="5" y="4" width="80" height="12" rx="2" fill="${D}" stroke="${S}" stroke-width="1"/>
  <text x="45" y="13" text-anchor="middle" font-size="7" fill="${L}">Lid</text>
  <rect x="10" y="16" width="70" height="8" fill="${LG}" stroke="${G}" stroke-width="0.8"/>
  <text x="45" y="22" text-anchor="middle" font-size="6" fill="${G}">TIM1</text>
  <rect x="15" y="24" width="60" height="22" rx="1" fill="${BG}" stroke="${S}" stroke-width="1"/>
  <text x="45" y="37" text-anchor="middle" font-size="8" fill="${L}" font-weight="600">Die</text>
  <rect x="10" y="46" width="70" height="12" rx="2" fill="${D}" stroke="${S}" stroke-width="1"/>
  <text x="45" y="54" text-anchor="middle" font-size="7" fill="${L}">Substrate</text>
  <line x1="45" y1="0" x2="45" y2="62" stroke="${G}" stroke-width="1.5" stroke-dasharray="4,2"/>
</svg>`,

through:`<svg ${V}>
  <rect x="10" y="2" width="70" height="7" rx="1" fill="${D}" stroke="${S}" stroke-width="1"/>
  <rect x="14" y="9" width="62" height="5" fill="${LG}" stroke="${G}" stroke-width="0.7"/>
  <rect x="16" y="14" width="58" height="14" fill="${BG}" stroke="${S}" stroke-width="1"/>
  <text x="45" y="23" text-anchor="middle" font-size="7" fill="${L}">Die</text>
  <rect x="14" y="28" width="62" height="4" fill="#0e2010" stroke="${T}" stroke-width="0.7"/>

function showView(v) {
  ["dashboard","new","requests","detail","guide"].forEach(id=>{
    document.getElementById("view-"+id).classList.toggle("hidden", id!==v);
    document.getElementById("tab-"+id).classList.toggle("active", id===v);

  const mm = String(now.getMonth()+1).padStart(2,"0");

  const prefix = `XS-${yy}${mm}-`;

let newForm = {};
let selectedDiagram = "standard";

// ─── CANVAS STATE ─────────────────────────────────────────────────────────
let canvasShapes   = [];          // all drawn shapes
let canvasTool     = "select";    // active tool
let canvasColor    = "#76B900";   // stroke/fill color
let canvasLineW    = 2;
let canvasDash     = "solid";
let canvasFill     = "none";
let canvasTextSize = 14;
let canvasDrawing  = false;
let canvasStart    = {x:0,y:0};
let canvasCurrent  = null;        // shape being drawn
let canvasSelected = null;        // index of selected shape
let lastSelected   = null;        // preserved for button clicks outside canvas
let canvasDragOff  = {x:0,y:0};
let canvasHistory  = [];          // for undo
let canvasCutCount = 1;           // auto cross number
let canvasDimLabel = "";          // current dimension label (number+unit)
let _cvs = null, _ctx = null;     // canvas refs
// Zoom / pan state
let cvZoom    = 1.0;              // current zoom level
let cvPanX    = 0;                // pan offset X (canvas coords)
let cvPanY    = 0;                // pan offset Y
let cvPanning = false;            // middle-button / space+drag panning
let cvPanStart= {x:0,y:0};       // mouse pos when pan started
let cvSpaceDown = false;          // space held for pan mode

function canvasInit() {
  _cvs = document.getElementById("xs-canvas");
  if (!_cvs) return;
  _ctx = _cvs.getContext("2d");
  cvZoom=1; cvPanX=0; cvPanY=0;
  canvasRedraw();

  _cvs.addEventListener("mousedown",  canvasMD);
  _cvs.addEventListener("mousemove",  canvasMV);
  _cvs.addEventListener("mouseup",    canvasMU);
  _cvs.addEventListener("mouseleave", e=>{ cvPanning=false; canvasMU(e); });
  _cvs.addEventListener("contextmenu", e=>e.preventDefault());

  // Wheel to zoom (Ctrl+wheel or plain wheel)
  _cvs.addEventListener("wheel", e=>{
    e.preventDefault();
    const r   = _cvs.getBoundingClientRect();
    const mx  = (e.clientX - r.left) * (_cvs.width  / r.width);
    const my  = (e.clientY - r.top)  * (_cvs.height / r.height);
    const factor = e.ctrlKey ? 0.05 : 0.12;
    const delta  = e.deltaY < 0 ? (1+factor) : (1-factor);
    const newZoom = Math.max(0.1, Math.min(20, cvZoom * delta));
    // zoom toward mouse pointer
    cvPanX = mx - (mx - cvPanX) * (newZoom / cvZoom);
    cvPanY = my - (my - cvPanY) * (newZoom / cvZoom);
    cvZoom = newZoom;
    updateZoomDisplay();
    canvasRedraw();
  }, {passive:false});

  // Middle-mouse button pan
  _cvs.addEventListener("mousedown", e=>{
    if (e.button===1) { e.preventDefault(); cvPanning=true; cvPanStart={x:e.clientX,y:e.clientY}; }
  });

  // Touch pinch-to-zoom
  let lastTouchDist = null;
  _cvs.addEventListener("touchstart", e=>{
    e.preventDefault();
    if (e.touches.length===2) {
      lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                                  e.touches[0].clientY-e.touches[1].clientY);
    } else { lastTouchDist=null; canvasMD(e.touches[0]); }
  }, {passive:false});
  _cvs.addEventListener("touchmove", e=>{
    e.preventDefault();
    if (e.touches.length===2 && lastTouchDist!==null) {
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                               e.touches[0].clientY-e.touches[1].clientY);
      const r = _cvs.getBoundingClientRect();
      const cx2 = ((e.touches[0].clientX+e.touches[1].clientX)/2-r.left)*(_cvs.width/r.width);
      const cy2 = ((e.touches[0].clientY+e.touches[1].clientY)/2-r.top)*(_cvs.height/r.height);
      const factor = dist/lastTouchDist;
      const newZoom = Math.max(0.1,Math.min(20,cvZoom*factor));
      cvPanX = cx2-(cx2-cvPanX)*(newZoom/cvZoom);
      cvPanY = cy2-(cy2-cvPanY)*(newZoom/cvZoom);
      cvZoom = newZoom;
      lastTouchDist = dist;
      updateZoomDisplay(); canvasRedraw();
    } else { canvasMV(e.touches[0]); }
  }, {passive:false});
  _cvs.addEventListener("touchend", e=>{ e.preventDefault(); lastTouchDist=null; canvasMU(e.changedTouches[0]); }, {passive:false});

  // Space to enter pan mode
  _cvs.addEventListener("keydown", e=>{
    if (e.code==="Space" && document.activeElement?.id==="xs-canvas") { cvSpaceDown=true; _cvs.style.cursor="grab"; e.preventDefault(); }
    if (e.code==="Equal"&&(e.ctrlKey||e.metaKey)) { e.preventDefault(); zoomStep(1.25); }
    if (e.code==="Minus"&&(e.ctrlKey||e.metaKey)) { e.preventDefault(); zoomStep(0.8); }
    if (e.code==="Digit0"&&(e.ctrlKey||e.metaKey)) { e.preventDefault(); zoomReset(); }
    if (e.code==="Delete"||e.code==="Backspace") { if(canvasSelected!==null||lastSelected!==null) canvasDeleteSelected(); }
  });
  _cvs.addEventListener("keyup", e=>{
    if (e.code==="Space") { cvSpaceDown=false; _cvs.style.cursor="crosshair"; }
  });
}

function updateZoomDisplay() {
  const el = document.getElementById("zoom-display");
  if (el) el.textContent = Math.round(cvZoom*100)+"%";
}

function zoomStep(factor) {
  const cx2=_cvs.width/2, cy2=_cvs.height/2;
  const newZoom = Math.max(0.1, Math.min(20, cvZoom*factor));
  cvPanX = cx2-(cx2-cvPanX)*(newZoom/cvZoom);
  cvPanY = cy2-(cy2-cvPanY)*(newZoom/cvZoom);
  cvZoom = newZoom;
  updateZoomDisplay(); canvasRedraw();
}

function zoomReset() {
  cvZoom=1; cvPanX=0; cvPanY=0;
  updateZoomDisplay(); canvasRedraw();
}

function zoomFit() {
  if (!canvasShapes.length) { zoomReset(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  canvasShapes.forEach(s=>{
    const xs=[s.x,s.x2??s.x], ys=[s.y,s.y2??s.y];
    xs.forEach(v=>{ minX=Math.min(minX,v); maxX=Math.max(maxX,v); });
    ys.forEach(v=>{ minY=Math.min(minY,v); maxY=Math.max(maxY,v); });
  });
  const pad=60, cw=_cvs.width, ch=_cvs.height;
  const fw=cw-pad*2, fh=ch-pad*2;
  const sw=maxX-minX||1, sh=maxY-minY||1;
  cvZoom = Math.min(fw/sw, fh/sh, 10);
  cvPanX = pad - minX*cvZoom;
  cvPanY = pad - minY*cvZoom;
  updateZoomDisplay(); canvasRedraw();
}

function cxy(e) {
  const r  = _cvs.getBoundingClientRect();
  const sx = _cvs.width  / r.width;
  const sy = _cvs.height / r.height;
  const px = (e.clientX - r.left)*sx;
  const py = (e.clientY - r.top)*sy;
  // convert from screen canvas coords to world coords (undo zoom/pan)
  return { x: (px - cvPanX) / cvZoom, y: (py - cvPanY) / cvZoom };
}

function cxyScreen(e) {
  // raw screen coords (for panning)
  return { x: e.clientX, y: e.clientY };
}

function canvasMD(e) {
  _cvs.focus({preventScroll:true});
  if (!_cvs) return;
  // Middle mouse or space+drag = pan
  if (e.button===1 || cvSpaceDown) {
    cvPanning = true;
    cvPanStart = cxyScreen(e);
    _cvs.style.cursor = "grabbing";
    return;
  }
  const p = cxy(e);
  if (canvasTool === "select") {
    canvasSelected = null;
    for (let i = canvasShapes.length-1; i >= 0; i--) {
      if (shapeHit(canvasShapes[i], p)) {
        canvasHistory.push(JSON.stringify(canvasShapes));
        canvasSelected = i;
        lastSelected   = i;
        canvasDragOff = { x: p.x - (canvasShapes[i].x||0), y: p.y - (canvasShapes[i].y||0) };
        break;
      }
    }
    canvasDrawing = canvasSelected !== null;
    canvasRedraw();
    return;
  }
  if (canvasTool === "text") {
    const txt = prompt("Enter text label:");
    if (!txt) return;
    canvasHistory.push(JSON.stringify(canvasShapes));
    canvasShapes.push({ type:"text", x:p.x, y:p.y, text:txt, color:canvasColor, size:canvasTextSize });
    canvasRedraw(); return;
  }
  if (canvasTool === "callout") {
    const txt = prompt("Callout text (shown in bubble):");
    if (!txt) return;
    canvasHistory.push(JSON.stringify(canvasShapes));
    canvasShapes.push({ type:"callout", x:p.x, y:p.y, text:txt, color:canvasColor, size:canvasTextSize });
    canvasRedraw(); return;
  }
  if (canvasTool === "cross") {
    canvasHistory.push(JSON.stringify(canvasShapes));
    canvasShapes.push({ type:"cross", x:p.x, y:p.y, color:canvasColor, lineW:canvasLineW, num:canvasCutCount });
    canvasCutCount++;
    document.getElementById("cut-count-disp") && (document.getElementById("cut-count-disp").textContent = "Next cut #" + canvasCutCount);
    canvasRedraw(); return;
  }
  canvasHistory.push(JSON.stringify(canvasShapes));
  canvasDrawing = true;
  canvasStart = p;
  canvasCurrent = { type:canvasTool, x:p.x, y:p.y, x2:p.x, y2:p.y,
    color:canvasColor, lineW:canvasLineW, dash:canvasDash, fill:canvasFill, dashOverride:true };
}

function canvasMV(e) {
  if (!_cvs) return;
  // Panning
  if (cvPanning) {
    const cur = cxyScreen(e);
    const r   = _cvs.getBoundingClientRect();
    const sx  = _cvs.width / r.width;
    const sy  = _cvs.height / r.height;
    cvPanX += (cur.x - cvPanStart.x) * sx;
    cvPanY += (cur.y - cvPanStart.y) * sy;
    cvPanStart = cur;
    canvasRedraw(); return;
  }
  if (!canvasDrawing) return;
  const p = cxy(e);
  if (canvasTool === "select" && canvasSelected !== null) {
    const moving=canvasShapes[canvasSelected],nx=p.x-canvasDragOff.x,ny=p.y-canvasDragOff.y;
    if(moving.x2!==undefined)moving.x2+=nx-moving.x;
    if(moving.y2!==undefined)moving.y2+=ny-moving.y;
    moving.x=nx;moving.y=ny;
    canvasRedraw(); return;
  }
  if (canvasCurrent) {
    canvasCurrent.x2 = p.x; canvasCurrent.y2 = p.y;
    canvasRedraw();
    drawShape(_ctx, canvasCurrent, true);
  }
}

function canvasMU(e) {
  if (!_cvs) return;
  if (cvPanning) {
    cvPanning = false;
    _cvs.style.cursor = cvSpaceDown ? "grab" : "crosshair";
    return;
  }
  if (canvasTool === "select") { canvasDrawing = false; return; }
  if (canvasDrawing && canvasCurrent) {
    const p = cxy(e||{clientX:0,clientY:0});
    canvasCurrent.x2 = p.x||canvasCurrent.x2; canvasCurrent.y2 = p.y||canvasCurrent.y2;
    const dx = Math.abs(canvasCurrent.x2-canvasCurrent.x);
    const dy = Math.abs(canvasCurrent.y2-canvasCurrent.y);
    if (dx > 3 || dy > 3) {
      const shape = {...canvasCurrent};
      // attach dim label if one is typed
      if (["dimline","dimradius","dimangle","leader"].includes(shape.type)) {
        // prefer canvasDimLabel (number+unit), fall back to manual input
        buildDimLabel();
        const lbl = canvasDimLabel || document.getElementById("dim-label-input")?.value.trim();
        if (lbl) shape.label = lbl;
        // for leader, also ask for text if not set
        if (shape.type==="leader" && !shape.text) {
          const lt = prompt("Leader note text:", "");
          if (lt) shape.text = lt;
        }
      }
      canvasShapes.push(shape);
    } else canvasHistory.pop();
  }
  canvasDrawing = false;
  canvasCurrent = null;
  canvasRedraw();
}

function shapeHit(s, p) {
  const mx=Math.min(s.x,s.x2??s.x), my=Math.min(s.y,s.y2??s.y);
  const mw=Math.abs((s.x2??s.x)-s.x)+10, mh=Math.abs((s.y2??s.y)-s.y)+10;
  if (s.type==="text"||s.type==="cross") return Math.abs(p.x-s.x)<18&&Math.abs(p.y-s.y)<18;
  return p.x>=mx-6&&p.x<=mx+mw&&p.y>=my-6&&p.y<=my+mh;
}

function drawShape(ctx, s, preview=false) {
  ctx.save();
  ctx.strokeStyle = s.color||"#76B900";
  ctx.lineWidth   = s.lineW||2;
  ctx.fillStyle   = s.fill&&s.fill!=="none" ? s.fill : "transparent";
  ctx.setLineDash(linePattern(s.dash,s.lineW));
  ctx.lineCap=["dotted","dashdot"].includes(s.dash)?"round":"butt";

  const x=s.x, y=s.y, x2=s.x2??x, y2=s.y2??y;
  const w=x2-x, h=y2-y, cx=(x+x2)/2, cy=(y+y2)/2;

  switch(s.type) {
    case "rect":
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      break;
    case "rectround":
      const r2=Math.min(12,Math.abs(w)/4,Math.abs(h)/4);
      ctx.beginPath(); ctx.roundRect(x,y,w,h,r2);
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke(); break;
    case "ellipse":
      ctx.beginPath(); ctx.ellipse(cx,cy,Math.abs(w)/2,Math.abs(h)/2,0,0,Math.PI*2);
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke(); break;
    case "circle":
      const rr=Math.max(Math.abs(w),Math.abs(h))/2;
      ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2);
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke(); break;
    case "line":
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke(); break;
    case "arrow":
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      const ang=Math.atan2(y2-y,x2-x), hs=12;
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-hs*Math.cos(ang-0.4), y2-hs*Math.sin(ang-0.4));
      ctx.lineTo(x2-hs*Math.cos(ang+0.4), y2-hs*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=s.color; ctx.fill(); break;
    case "arrow2":
      // double arrow
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      [{ from:[x,y],to:[x2,y2] },{ from:[x2,y2],to:[x,y] }].forEach(({from,to})=>{
        const a=Math.atan2(to[1]-from[1],to[0]-from[0]),hs2=10;
        ctx.beginPath();
        ctx.moveTo(to[0],to[1]);
        ctx.lineTo(to[0]-hs2*Math.cos(a-0.4),to[1]-hs2*Math.sin(a-0.4));
        ctx.lineTo(to[0]-hs2*Math.cos(a+0.4),to[1]-hs2*Math.sin(a+0.4));
        ctx.closePath(); ctx.fillStyle=s.color; ctx.fill();
      }); break;
    case "cutline":
      ctx.setLineDash(s.dashOverride?linePattern(s.dash,s.lineW):[14,6]);
      ctx.strokeStyle = s.color||"#4A90D9";
      ctx.lineWidth = (s.lineW||2)+0.5;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.setLineDash([]);
      // tick marks
      const ang2=Math.atan2(y2-y,x2-x), perp=ang2+Math.PI/2;
      [[x,y],[x2,y2]].forEach(([px,py])=>{
        ctx.beginPath();
        ctx.moveTo(px+Math.cos(perp)*8, py+Math.sin(perp)*8);
        ctx.lineTo(px-Math.cos(perp)*8, py-Math.sin(perp)*8);
        ctx.stroke();
      }); break;
    case "cross":
      const csz=14;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(s.x-csz,s.y); ctx.lineTo(s.x+csz,s.y);
      ctx.moveTo(s.x,s.y-csz); ctx.lineTo(s.x,s.y+csz);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x,s.y,csz,0,Math.PI*2);
      ctx.strokeStyle=s.color; ctx.stroke();
      ctx.fillStyle=s.color;
      ctx.font="bold 11px monospace";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.num||"1", s.x, s.y); break;
    case "lid":
      // lid body
      ctx.strokeRect(x,y,w,h*0.25);
      if (s.fill&&s.fill!=="none") { ctx.fillRect(x,y,w,h*0.25); }
      // legs
      const legW=Math.max(8,Math.abs(w)*0.12);
      const legH=Math.abs(h)*0.7;
      ctx.strokeRect(x+legW*0.3, y+h*0.25, legW, legH);
      ctx.strokeRect(x2-legW*0.3-legW, y+h*0.25, legW, legH); break;
    case "lidflat":
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h); break;
    case "die":
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      ctx.font="bold "+(Math.min(Math.abs(w),Math.abs(h))*0.2)+"px sans-serif";
      ctx.fillStyle=s.color; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("Die",cx,cy); break;
    case "layer":
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      // hatching
      ctx.save(); ctx.clip();
      ctx.strokeStyle=s.color+"66"; ctx.lineWidth=0.8; ctx.setLineDash([]);
      for(let i=-Math.abs(h);i<Math.abs(w)+Math.abs(h);i+=10){
        ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i+Math.abs(h),y+Math.abs(h)); ctx.stroke();
      }
      ctx.restore(); ctx.strokeRect(x,y,w,h); break;
    case "void":
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.ellipse(cx,cy,Math.abs(w)/2,Math.abs(h)/2,0,0,Math.PI*2);
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke(); break;
    case "crack":
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x,y);
      const steps=6, ddx=(x2-x)/steps, ddy=(y2-y)/steps;
      for(let i=1;i<=steps;i++){
        const jx=(Math.random()-0.5)*14, jy=(Math.random()-0.5)*6;
        ctx.lineTo(x+ddx*i+jx, y+ddy*i+jy);
      }
      ctx.stroke(); break;
    case "triangle":
      ctx.beginPath();
      ctx.moveTo(cx,y); ctx.lineTo(x2,y2); ctx.lineTo(x,y2); ctx.closePath();
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke(); break;
    case "diamond":
      ctx.beginPath();
      ctx.moveTo(cx,y); ctx.lineTo(x2,cy); ctx.lineTo(cx,y2); ctx.lineTo(x,cy); ctx.closePath();
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke(); break;
    case "hexagon":
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/3*i-Math.PI/6, rh=Math.min(Math.abs(w),Math.abs(h))/2;
        i===0?ctx.moveTo(cx+rh*Math.cos(a),cy+rh*Math.sin(a))
             :ctx.lineTo(cx+rh*Math.cos(a),cy+rh*Math.sin(a));
      }
      ctx.closePath(); if(s.fill&&s.fill!=="none")ctx.fill(); ctx.stroke(); break;
    case "wire":
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.quadraticCurveTo(cx, y - Math.abs(h)*1.2, x2, y2);
      ctx.stroke(); break;
    case "dimline": {
      // linear dimension with real label
      ctx.setLineDash(linePattern(s.dash,s.lineW));
      const da=Math.atan2(y2-y,x2-x), dp=da+Math.PI/2, tl=10;
      // extension lines
      [[x,y],[x2,y2]].forEach(([px,py])=>{
        ctx.beginPath();
        ctx.moveTo(px+Math.cos(dp)*tl, py+Math.sin(dp)*tl);
        ctx.lineTo(px-Math.cos(dp)*tl, py-Math.sin(dp)*tl);
        ctx.stroke();
      });
      // main line with arrowheads
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      [{ from:[x,y],to:[x2,y2] },{ from:[x2,y2],to:[x,y] }].forEach(({from,to})=>{
        const a=Math.atan2(to[1]-from[1],to[0]-from[0]), hs=9;
        ctx.beginPath();
        ctx.moveTo(from[0],from[1]);
        ctx.lineTo(from[0]+hs*Math.cos(a-0.35), from[1]+hs*Math.sin(a-0.35));
        ctx.lineTo(from[0]+hs*Math.cos(a+0.35), from[1]+hs*Math.sin(a+0.35));
        ctx.closePath(); ctx.fillStyle=s.color; ctx.fill();
      });
      // label - use stored real-world label or show pixel fallback
      const dlabel = s.label || (Math.round(Math.sqrt((x2-x)**2+(y2-y)**2))+" px");
      const dfont = "bold 12px 'Courier New',monospace";
      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(da);
      ctx.font = dfont;
      const dtw = ctx.measureText(dlabel).width;
      const dpad = 5, dh = 16;
      // background pill
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.roundRect(-dtw/2-dpad, -dh-2, dtw+dpad*2, dh, 4);
      ctx.fill();
      // colored border
      ctx.strokeStyle = s.color; ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.roundRect(-dtw/2-dpad, -dh-2, dtw+dpad*2, dh, 4);
      ctx.stroke();
      ctx.fillStyle = s.color;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(dlabel, 0, -dh/2-2);
      ctx.restore(); break;
    }
    case "dimradius": {
      // radius dimension
      ctx.setLineDash([]);
      const rr2=Math.sqrt((x2-x)**2+(y2-y)**2);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      const ang3=Math.atan2(y2-y,x2-x), hs3=9;
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-hs3*Math.cos(ang3-0.35),y2-hs3*Math.sin(ang3-0.35));
      ctx.lineTo(x2-hs3*Math.cos(ang3+0.35),y2-hs3*Math.sin(ang3+0.35));
      ctx.closePath(); ctx.fillStyle=s.color; ctx.fill();
      const rlabel = s.label ? "R " + s.label : ("R "+Math.round(rr2)+" px");
      const rfont = "bold 12px 'Courier New',monospace";
      ctx.font = rfont;
      const rtw = ctx.measureText(rlabel).width;
      const rpad = 4;
      ctx.fillStyle = "#111";
      ctx.beginPath(); ctx.roundRect(cx-rtw/2-rpad, cy-18, rtw+rpad*2, 16, 3); ctx.fill();
      ctx.strokeStyle = s.color; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.roundRect(cx-rtw/2-rpad, cy-18, rtw+rpad*2, 16, 3); ctx.stroke();
      ctx.fillStyle = s.color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(rlabel, cx, cy-10); break;
    }
    case "dimangle": {
      // angle arc dimension
      ctx.setLineDash([]);
      const ar=Math.min(Math.abs(w),Math.abs(h))*0.4||30;
      ctx.beginPath(); ctx.arc(x,y,ar, Math.atan2(h*0.1,w), Math.atan2(h,w));
      ctx.stroke();
      const alabel = s.label || (Math.round(Math.atan2(Math.abs(h),Math.abs(w))*180/Math.PI)+"°");
      const alx = x+ar*1.4*Math.cos(Math.atan2(h,w)*0.5);
      const aly = y+ar*1.4*Math.sin(Math.atan2(h,w)*0.5);
      ctx.font = "bold 12px 'Courier New',monospace";
      const atw = ctx.measureText(alabel).width + 8;
      ctx.fillStyle="#111"; ctx.beginPath(); ctx.roundRect(alx-atw/2,aly-10,atw,16,3); ctx.fill();
      ctx.strokeStyle=s.color; ctx.lineWidth=0.8; ctx.beginPath(); ctx.roundRect(alx-atw/2,aly-10,atw,16,3); ctx.stroke();
      ctx.fillStyle=s.color; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(alabel, alx, aly); break;
    }
    case "leader": {
      // leader line with arrowhead and text
      ctx.setLineDash([]);
      const ang4=Math.atan2(y2-y,x2-x), hs4=9;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2);
      ctx.lineTo(x2+(w>0?30:-30), y2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+hs4*Math.cos(ang4-0.35),y+hs4*Math.sin(ang4-0.35));
      ctx.lineTo(x+hs4*Math.cos(ang4+0.35),y+hs4*Math.sin(ang4+0.35));
      ctx.closePath(); ctx.fillStyle=s.color; ctx.fill();
      if (s.text) {
        ctx.fillStyle=s.color; ctx.font=(s.size||12)+"px sans-serif";
        ctx.textAlign = w>0?"left":"right";
        ctx.textBaseline="bottom";
        ctx.fillText(s.text, x2+(w>0?32:-32), y2);
      } break;
    }
    case "board": {
      // PCB board outline with corner markers
      ctx.setLineDash([]);
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") { ctx.fillRect(x,y,w,h); }
      // corner marks
      const cm=10;
      [[x,y],[x2,y],[x,y2],[x2,y2]].forEach(([cx2,cy2])=>{
        const sx2=cx2===x?1:-1, sy2=cy2===y?1:-1;
        ctx.beginPath();
        ctx.moveTo(cx2+sx2*cm,cy2); ctx.lineTo(cx2,cy2); ctx.lineTo(cx2,cy2+sy2*cm);
        ctx.stroke();
      });
      // board label
      ctx.fillStyle=s.color; ctx.font="bold 11px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.label||"PCB", cx, cy); break;
    }
    case "backshell": {
      // Backshell cross-section shape
      ctx.setLineDash([]);
      const bsh=Math.abs(h), bsw=Math.abs(w);
      // main body
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      // left connector hood (1/3 of height)
      const hoodH=bsh*0.5, hoodW=bsw*0.18;
      ctx.strokeRect(x, y+(bsh-hoodH)/2, hoodW*(w>0?-1:1), hoodH);
      // cable exit right side - flare
      const exitW=hoodW, exitX=w>0?x2:x;
      ctx.beginPath();
      ctx.moveTo(exitX, y+bsh*0.2);
      ctx.lineTo(exitX+(w>0?exitW:-exitW), y+bsh*0.1);
      ctx.lineTo(exitX+(w>0?exitW:-exitW), y+bsh*0.9);
      ctx.lineTo(exitX, y+bsh*0.8);
      ctx.stroke();
      // cable lines inside
      const nc=4;
      for(let i=0;i<nc;i++){
        const cy3=y+bsh*(0.25+i*0.15);
        ctx.beginPath(); ctx.setLineDash([6,3]);
        ctx.moveTo(x+bsw*0.15,cy3); ctx.lineTo(x+bsw*0.85,cy3); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.fillStyle=s.color; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.label||"Backshell",cx,cy); break;
    }
    case "cover": {
      // Flat sheet-metal cover (U-profile)
      ctx.setLineDash([]);
      const tw=Math.abs(w), th=Math.abs(h), ts=Math.max(6,th*0.12);
      ctx.beginPath();
      ctx.moveTo(x,           y2);
      ctx.lineTo(x,           y+ts);
      ctx.lineTo(x+ts,        y);
      ctx.lineTo(x2-ts,       y);
      ctx.lineTo(x2,          y+ts);
      ctx.lineTo(x2,          y2);
      if (s.fill&&s.fill!=="none") { ctx.fillStyle=s.fill; ctx.fill(); }
      ctx.stroke();
      ctx.fillStyle=s.color; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.fillText(s.label||"Cover", cx, y+ts+3); break;
    }
    case "lidlegs": {
      // Lid with two legs - precise version
      ctx.setLineDash([]);
      const lw2=Math.abs(w), lh2=Math.abs(h);
      const topH=Math.max(8,lh2*0.2), legW=Math.max(8,lw2*0.12), legH=lh2-topH;
      // top bar
      ctx.strokeRect(x,y,w,topH*(h>0?1:-1));
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,topH*(h>0?1:-1));
      // left leg
      const ly=h>0?y+topH:y-topH;
      ctx.strokeRect(x+(w>0?legW*0.3:-legW*1.3), ly, legW*(w>0?1:-1), legH*(h>0?1:-1));
      // right leg
      ctx.strokeRect(x2-(w>0?legW*1.3:-legW*0.3), ly, legW*(w>0?1:-1), legH*(h>0?1:-1));
      ctx.fillStyle=s.color; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.label||"Lid", cx, h>0?y+topH/2:y-topH/2); break;
    }
    case "via": {
      // PCB via barrel
      ctx.setLineDash([]);
      const vw=Math.max(8,Math.abs(w));
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      // inner hole
      const holeR=vw*0.25;
      ctx.beginPath(); ctx.arc(cx,cy,holeR,0,Math.PI*2);
      ctx.strokeStyle="#000"; ctx.fillStyle="#1a1a1a"; ctx.fill(); ctx.stroke();
      ctx.strokeStyle=s.color;
      ctx.fillStyle=s.color; ctx.font="9px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.fillText("via",cx,Math.min(y,y2)+Math.abs(h)*0.7); break;
    }
    case "substrate": {
      // Substrate with buildup layers
      ctx.setLineDash([]);
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      const lc=4, lthick=Math.abs(h)/lc;
      for(let i=1;i<lc;i++){
        ctx.beginPath(); ctx.setLineDash([4,4]);
        ctx.moveTo(x, y+lthick*i*(h>0?1:-1));
        ctx.lineTo(x2,y+lthick*i*(h>0?1:-1));
        ctx.strokeStyle=s.color+"66"; ctx.stroke();
        ctx.setLineDash([]); ctx.strokeStyle=s.color;
      }
      ctx.fillStyle=s.color; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.label||"Substrate", cx, cy); break;
    }
    case "enclosure": {
      // Module enclosure walls (open bottom)
      ctx.setLineDash([]);
      const ew=Math.abs(w), eh=Math.abs(h), wallT=Math.max(6,ew*0.08);
      ctx.strokeRect(x,y,w,h);
      if (s.fill&&s.fill!=="none") ctx.fillRect(x,y,w,h);
      // inner void
      ctx.clearRect(x+(w>0?wallT:-wallT), y+(h>0?wallT:-wallT),
        (ew-wallT*2)*(w>0?1:-1), (eh-wallT*2)*(h>0?1:-1));
      // redraw outer
      ctx.strokeRect(x,y,w,h);
      ctx.fillStyle=s.color; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.label||"Enclosure",cx,cy); break;
    }
    case "stackup": {
      // Layer stack-up block with horizontal stripes
      ctx.setLineDash([]);
      ctx.strokeRect(x,y,w,h);
      const n=s.layers||5, lhh=Math.abs(h)/n;
      const lcols=["#cc8800","#1a3300","#cc8800","#1a3300","#cc8800"];
      for(let i=0;i<n;i++){
        ctx.fillStyle=lcols[i%lcols.length]+"88";
        ctx.fillRect(x,y+lhh*i*(h>0?1:-1), w, lhh*(h>0?1:-1));
        if(i>0){ ctx.beginPath(); ctx.setLineDash([]);
          ctx.moveTo(x,y+lhh*i*(h>0?1:-1)); ctx.lineTo(x2,y+lhh*i*(h>0?1:-1));
          ctx.strokeStyle=s.color+"44"; ctx.stroke(); ctx.strokeStyle=s.color; }
      }
      ctx.strokeRect(x,y,w,h);
      ctx.fillStyle=s.color; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(s.label||"Stack-up",cx,cy); break;
    }
    case "solder_ball": {
      // Solder ball / BGA ball
      ctx.setLineDash([]);
      const sbr=Math.min(Math.abs(w),Math.abs(h))/2;
      // pad top
      ctx.fillStyle=s.color+"44";
      ctx.fillRect(cx-sbr*0.8, Math.min(y,y2), sbr*1.6, sbr*0.25*(h>0?1:-1));
      ctx.strokeRect(cx-sbr*0.8, Math.min(y,y2), sbr*1.6, sbr*0.25*(h>0?1:-1));
      // ball
      ctx.beginPath(); ctx.arc(cx,cy,sbr*0.7,0,Math.PI*2);
      if (s.fill&&s.fill!=="none") ctx.fill(); ctx.stroke();
      // pad bottom
      ctx.fillStyle=s.color+"44";
      ctx.fillRect(cx-sbr*0.8, Math.max(y,y2)-sbr*0.25*(h>0?1:-1), sbr*1.6, sbr*0.25*(h>0?1:-1));
      ctx.strokeRect(cx-sbr*0.8, Math.max(y,y2)-sbr*0.25*(h>0?1:-1), sbr*1.6, sbr*0.25*(h>0?1:-1)); break;
    }
    case "text":
      ctx.setLineDash([]);
      ctx.fillStyle=s.color;
      ctx.font=(s.bold?"bold ":"")+(s.size||14)+"px sans-serif";
      ctx.textAlign="left"; ctx.textBaseline="top";
      ctx.fillText(s.text||"", s.x, s.y); break;
    case "callout": {
      // Callout bubble
      ctx.setLineDash([]);
      const ctxt=s.text||"Note", cpad=6;
      ctx.font=(s.size||12)+"px sans-serif";
      const ctw=ctx.measureText(ctxt).width+cpad*2, cth=18;
      const cbx=s.x-ctw/2, cby=s.y-cth-8;
      ctx.beginPath(); ctx.roundRect(cbx,cby,ctw,cth,4); 
      ctx.fillStyle="#111"; ctx.fill();
      ctx.strokeStyle=s.color; ctx.stroke();
      // tail
      ctx.beginPath(); ctx.moveTo(s.x-6,s.y-8); ctx.lineTo(s.x,s.y); ctx.lineTo(s.x+6,s.y-8); ctx.closePath();
      ctx.fillStyle="#111"; ctx.fill(); ctx.strokeStyle=s.color; ctx.stroke();
      ctx.fillStyle=s.color; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(ctxt, s.x, cby+cth/2); break;
    }
  }
  ctx.restore();
}

function canvasRedraw() {
  if (!_cvs||!_ctx) return;
  _ctx.clearRect(0,0,_cvs.width,_cvs.height);

  // Apply zoom/pan transform for everything below
  _ctx.save();
  _ctx.translate(cvPanX, cvPanY);
  _ctx.scale(cvZoom, cvZoom);

  // Grid — draw in world space, spacing adapts to zoom
  const rawSpacing = 20;
  const worldSpacing = rawSpacing;  // grid is in world coords
  const wLeft   = -cvPanX / cvZoom;
  const wTop    = -cvPanY / cvZoom;
  const wRight  = (_cvs.width  - cvPanX) / cvZoom;
  const wBottom = (_cvs.height - cvPanY) / cvZoom;
  _ctx.save();
  _ctx.strokeStyle = "#2a2a2a";
  _ctx.lineWidth = 0.5 / cvZoom;
  // minor grid
  const startX = Math.floor(wLeft/worldSpacing)*worldSpacing;
  const startY = Math.floor(wTop/worldSpacing)*worldSpacing;
  for(let gx=startX; gx<=wRight; gx+=worldSpacing){
    _ctx.beginPath(); _ctx.moveTo(gx,wTop); _ctx.lineTo(gx,wBottom); _ctx.stroke();
  }
  for(let gy=startY; gy<=wBottom; gy+=worldSpacing){
    _ctx.beginPath(); _ctx.moveTo(wLeft,gy); _ctx.lineTo(wRight,gy); _ctx.stroke();
  }
  // major grid every 100px
  _ctx.strokeStyle="#383838"; _ctx.lineWidth=0.8/cvZoom;
  for(let gx=Math.floor(wLeft/100)*100; gx<=wRight; gx+=100){
    _ctx.beginPath(); _ctx.moveTo(gx,wTop); _ctx.lineTo(gx,wBottom); _ctx.stroke();
  }
  for(let gy=Math.floor(wTop/100)*100; gy<=wBottom; gy+=100){
    _ctx.beginPath(); _ctx.moveTo(wLeft,gy); _ctx.lineTo(wRight,gy); _ctx.stroke();
  }
  _ctx.restore();

  // Draw all shapes
  canvasShapes.forEach((s,i)=>{
    drawShape(_ctx,s,false);
    if (i===canvasSelected) {
      _ctx.save();
      _ctx.strokeStyle="#fff"; _ctx.lineWidth=1.5/cvZoom; _ctx.setLineDash([4/cvZoom,3/cvZoom]);
      const bx=Math.min(s.x,s.x2??s.x)-6, by=Math.min(s.y,s.y2??s.y)-6;
      const bw=Math.abs((s.x2??s.x)-s.x)+12, bh=Math.abs((s.y2??s.y)-s.y)+12;
      _ctx.strokeRect(bx,by,bw,bh);
      _ctx.restore();
    }
  });

  _ctx.restore(); // end zoom/pan transform

  // Draw zoom level overlay (in screen space, unaffected by transform)
  _ctx.save();
  _ctx.fillStyle="#76B900"; _ctx.font="bold 11px monospace";
  _ctx.textAlign="right"; _ctx.textBaseline="bottom";
  _ctx.fillStyle="#0008"; _ctx.fillRect(_cvs.width-68,_cvs.height-22,66,18);
  _ctx.fillStyle="#76B900";
  _ctx.fillText(Math.round(cvZoom*100)+"% zoom", _cvs.width-4, _cvs.height-4);
  _ctx.restore();
}

function canvasUndo() {
  if (!canvasHistory.length) return;
  canvasShapes = JSON.parse(canvasHistory.pop());
  canvasSelected = null; canvasRedraw();
}

function canvasClear() {
  canvasHistory.push(JSON.stringify(canvasShapes));
  canvasShapes=[]; canvasCutCount=1; canvasSelected=null; lastSelected=null;
  cvZoom=1; cvPanX=0; cvPanY=0;
  canvasRedraw(); updateZoomDisplay();
  const el=document.getElementById("cut-count-disp");
  if(el) el.textContent="Next cut #1";
  showCanvasMsg("Canvas cleared — click Undo to restore");
}

function canvasDeleteSelected() {
  if (canvasSelected===null) return;
  canvasHistory.push(JSON.stringify(canvasShapes));
  canvasShapes.splice(canvasSelected,1);
  canvasSelected=null; canvasRedraw();
}

function canvasGetDataURL() {
  if (!_cvs) return null;
  // compute bounding box of all shapes
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  canvasShapes.forEach(s=>{
    const bounds=shapeBoundsForExport(s);
    minX=Math.min(minX,bounds.left);maxX=Math.max(maxX,bounds.right);
    minY=Math.min(minY,bounds.top);maxY=Math.max(maxY,bounds.bottom);
  });
  if (!isFinite(minX)) { minX=0; minY=0; maxX=_cvs.width; maxY=_cvs.height; }
  const pad=40;
  const tw=Math.max(maxX-minX+pad*2, 400);
  const th=Math.max(maxY-minY+pad*2, 300);
  const tmp = document.createElement("canvas");
  tmp.width=tw; tmp.height=th;
  const tc = tmp.getContext("2d");
  tc.fillStyle="#1a1a1a"; tc.fillRect(0,0,tw,th);
  // translate so shapes are centered with padding
  tc.translate(pad-minX, pad-minY);
  canvasShapes.forEach(s=>drawShape(tc,s,false));
  return tmp.toDataURL("image/png");
}

// build label from number + unit fields → fill preview input
function buildDimLabel() {
  const val = document.getElementById("dim-value")?.value.trim();
  const unit = document.getElementById("dim-unit")?.value;
  if (!val) return;
  // smart formatting: no trailing .0 for whole numbers
  let num = parseFloat(val);
  let formatted;
  if (!isNaN(num)) {
    // show up to 3 significant decimal places, strip trailing zeros
    formatted = num % 1 === 0 ? String(num) : parseFloat(num.toFixed(3)).toString();
  } else {
    formatted = val;
  }
  const lbl = unit ? formatted + " " + unit : formatted;
  const inp = document.getElementById("dim-label-input");
  if (inp) inp.value = lbl;
  canvasDimLabel = lbl;
}

function clearDimLabel() {
  const vEl = document.getElementById("dim-value");
  const lEl = document.getElementById("dim-label-input");
  if (vEl) vEl.value = "";
  if (lEl) lEl.value = "";
  canvasDimLabel = "";
}

function applyDimLabel() {
  const idx = canvasSelected !== null ? canvasSelected : lastSelected;
  // get label from preview field or build from number+unit
  let lbl = document.getElementById("dim-label-input")?.value.trim();
  if (!lbl) buildDimLabel();
  lbl = document.getElementById("dim-label-input")?.value.trim();
  if (!lbl) { showCanvasMsg("Enter a value and unit first"); return; }
  if (idx === null || idx >= canvasShapes.length) { showCanvasMsg("Select a dimension shape first (↖ tool)"); return; }
  canvasHistory.push(JSON.stringify(canvasShapes));
  canvasShapes[idx].label = lbl;
  canvasSelected = idx;
  canvasRedraw();
  showCanvasMsg("✓ " + lbl + " applied");
}

function editSelected() {
  // use lastSelected as fallback since button click may reset canvasSelected
  const idx = canvasSelected !== null ? canvasSelected : lastSelected;
  if (idx === null || idx < 0 || idx >= canvasShapes.length) {
    showCanvasMsg("Select a shape first with the ↖ tool, then click Edit"); return;
  }
  const s = canvasShapes[idx];
  // determine what field to edit
  let field, cur, promptTxt;
  if (s.type==="text"||s.type==="callout") {
    field="text"; cur=s.text||""; promptTxt="Edit text:";
  } else if (["dimline","dimradius","dimangle","leader"].includes(s.type)) {
    field="label"; cur=s.label||""; promptTxt="Edit dimension label (e.g. 2.5 mm):";
  } else {
    field="label"; cur=s.label||""; promptTxt="Edit shape label:";
  }
  const val = prompt(promptTxt, cur);
  if (val===null) return;
  canvasHistory.push(JSON.stringify(canvasShapes));
  canvasShapes[idx][field] = val;
  // also update leader text field if applicable
  if (s.type==="leader") {
    const txt = prompt("Edit leader note text (or cancel to keep):", s.text||"");
    if (txt!==null) canvasShapes[idx].text = txt;
  }
  canvasSelected = idx;
  canvasRedraw();
}

function showCanvasMsg(msg) {
  let el = document.getElementById("canvas-msg");
  if (!el) { el=document.createElement("div"); el.id="canvas-msg";
    el.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#e0a020;padding:8px 16px;border-radius:8px;font-size:13px;z-index:999;border:1px solid #e0a020";
    document.body.appendChild(el); }
  el.textContent=msg; el.style.display="block";
  setTimeout(()=>{ el.style.display="none"; }, 2500);
}

  const [cw,ch] = v.split("x").map(Number);

  cvs.width=cw; cvs.height=ch;

  canvasRedraw();
}

      tb.appendChild(sep);
    }
    const glabel = document.createElement("span");
    glabel.style.cssText = "font-size:9px;color:#555;font-weight:700;margin:0 2px;letter-spacing:.04em;align-self:center";
    glabel.textContent = g.label;
    tb.appendChild(glabel);
    g.tools.forEach(([t,icon,tip]) => {
      const btn = document.createElement("button");
      btn.id = "xtool-"+t;
      btn.className = "xtool small" + (t==="select"?" xtool-active":"");
      btn.title = tip;
      btn.textContent = icon;
      btn.style.cssText = "padding:4px 7px;font-size:12px;min-width:28px";
      btn.onclick = () => setTool(t);
      tb.appendChild(btn);

}

async function submitRequest() {
  const sampleId = document.getElementById("f-sampleId").value.trim();
  const cutLoc   = document.getElementById("f-cutLocation").value.trim();
  const errEl    = document.getElementById("form-err");

  if(!sampleId){ errEl.textContent="Sample ID is required."; errEl.style.display="block"; return; }
  if(!cutLoc){ errEl.textContent="Cut location description is required."; errEl.style.display="block"; return; }
  errEl.style.display="none";

  const now = new Date().toISOString();
  const id  = genId();
  const bg  = document.getElementById("f-background").value.trim();
  const canvasImg = canvasGetDataURL();
  const req = {
    id, status:"open",
    product:   document.getElementById("f-product").value,
    sampleId,
    lot:       document.getElementById("f-lot").value.trim(),
    stage:     document.getElementById("f-stage").value,
    cutPlane:  document.getElementById("f-cutPlane").value,
    numCuts:   Number(document.getElementById("f-numCuts").value),
    cutLocation: cutLoc,
    objective: document.getElementById("f-objective").value,
    mag:       document.getElementById("f-mag").value,
    measurement: document.getElementById("f-measurement").value,
    priority:  document.getElementById("f-priority").value,
    background: bg,
    diagramType: selectedDiagram,
    canvasDrawing: canvasImg,
    requester: currentUser.id,
    requesterName: currentUser.name,
    analyst:   document.getElementById("f-analyst").value || null,
    created:   now,
    messages: bg ? [{id:"m0",author:currentUser.id,text:bg,images:[],measurements:[],ts:now}] : [],
  };
  requests.unshift(req);
  if(!await saveData())return;
  showToast(`Request ${id} submitted.`);
  openDetail(id);
  selectedDiagram = "standard";
}

async function saveEdit(reqId) {
  requests = requests.map(r => r.id!==reqId ? r : {
    ...r,
    sampleId: document.getElementById("e-sampleId").value.trim(),
    objective: document.getElementById("e-objective").value,
    cutLocation: document.getElementById("e-cutLoc").value.trim(),
    priority: document.getElementById("e-priority").value,
    analyst: document.getElementById("e-analyst").value||null,
    background: document.getElementById("e-bg").value.trim(),
  });
  if(!await saveData())return;
  document.getElementById("edit-modal").innerHTML="";
  renderDetail();
  showToast("Request updated.");
}

async function deleteReq(reqId) {
  if(!confirm(`Remove ${reqId}? The shared record is retained for owner recovery.`)) return;
  requests = requests.filter(r=>r.id!==reqId);
  if(!await saveData())return;
  showView("requests");
  showToast(`${reqId} deleted.`);
}

// ─── STATUS / FIELD UPDATE ───────────────────────────────────────────────────

async function updateStatus(status, reqId) {
  requests = requests.map(r=>r.id===(reqId||selectedReqId)?{...r,status}:r);
  if(!await saveData())return;
  renderDetail();
  showToast(`Status → ${STATUS_CFG[status]?.label||status}`);
}

async function updateField(reqId, field, value) {
  requests = requests.map(r=>r.id===reqId?{...r,[field]:value}:r);
  if(!await saveData())return;
}

// ─── REPLY ────────────────────────────────────────────────────────────────────

function handleImgUpload(event) {
  const files = Array.from(event.target.files);
  const preview = document.getElementById("img-preview-row");
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const src = e.target.result;
      pendingImages.push(src);
      const thumb = document.createElement("div");
      thumb.className = "img-thumb";
      thumb.innerHTML = `<img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover">`;
      preview.insertBefore(thumb, preview.lastElementChild);
    };
    reader.readAsDataURL(file);
  });
}

async function sendReply(reqId) {
  const text = document.getElementById("reply-text").value.trim();
  const measRaw = document.getElementById("reply-meas").value.trim();
  if(!text && pendingImages.length===0 && !measRaw) return;

  const measurements = measRaw ? measRaw.split(",").map(s=>s.trim()).filter(Boolean) : [];
  const msg = {
    id:"m_"+crypto.randomUUID().replaceAll("-",""),
    author: currentUser.id,
    authorName: currentUser.name,
    text: text||"(image / measurement attached)",
    images: [...pendingImages],
    measurements,
    ts: new Date().toISOString(),
  };
  requests = requests.map(r=>r.id===reqId?{...r,messages:[...(r.messages||[]),msg]}:r);
  pendingImages = [];
  if(!await saveData())return;
  renderDetail();
  showToast("Reply sent.");
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

        <text x="225" y="99" text-anchor="middle" font-size="14" fill="#eee" font-weight="700">Die</text>
        <rect x="75" y="126" width="300" height="10" fill="#0e2010" stroke="#4caf50" stroke-width="0.8"/>
        <text x="225" y="134" text-anchor="middle" font-size="9" fill="#4caf50">Underfill</text>
        <rect x="60" y="136" width="330" height="10" fill="#2a1500" stroke="#e0a020" stroke-width="0.8"/>
        <text x="225" y="144" text-anchor="middle" font-size="9" fill="#e0a020">Solder / BGA</text>
        <rect x="50" y="146" width="350" height="24" rx="2" fill="#333" stroke="#666" stroke-width="1"/>
        <text x="225" y="161" text-anchor="middle" font-size="11" fill="#aaa" font-weight="600">Substrate / PCB</text>
        <line x1="225" y1="10" x2="225" y2="180" stroke="#76B900" stroke-width="1.8" stroke-dasharray="6,3"/>
        <text x="225" y="9" text-anchor="middle" font-size="10" fill="#76B900" font-weight="700">Cut A — center baseline</text>
        <line x1="340" y1="10" x2="340" y2="180" stroke="#e0a020" stroke-width="1.5" stroke-dasharray="5,3"/>
        <text x="370" y="9" text-anchor="middle" font-size="9" fill="#e0a020">Cut B — feature</text>

        <text x="430" y="182" font-size="10" fill="#555">X →</text>

      ["1","Sample mounting and potting","Place sample face-down or edge-on in cold-cure epoxy mold (24 h) or warm-cure 60 °C / 4 h. Label with request ID and orientation arrow. Orientation determines which plane is exposed."],
      ["2","Rough sectioning","Use dicing saw or slow-speed diamond saw to remove bulk material to within ~500 µm of target plane. Verify position against the cut diagram in the request. For multiple cuts, plan saw sequence to preserve the section of interest."],
      ["3","Grinding to target plane","Grind sequentially: 400 → 800 → 1200 grit SiC paper. Check under stereo microscope after each step. Stop when target feature is exposed. Record depth removed (micrometer) and post to thread."],
      ["4","Polishing to mirror finish","9 µm → 3 µm → 1 µm diamond suspension. Final: 0.05 µm colloidal silica. Rinse IPA between steps. Surface must be scratch-free and flat for accurate measurement."],
      ["5","Optical imaging and measurement","Image at low, medium, and high magnification. Full cross-section width plus detail shots of region of interest. Take calibrated measurements. Upload all images and measurements to the request thread."],

      <div><div style="font-size:13px;font-weight:600;margin-bottom:3px">${title}</div><div style="font-size:12px;color:var(--text2);line-height:1.5">${desc}</div></div>
    </div>`).join("")}
  </div>`;
}

// ─── PRESENTATION EXPORT ──────────────────────────────────────────────────────

async function exportPresentation(reqId) {
  if(resultsDirty||uploadBusy){showToast("Save the summary and finish uploads before exporting.");return;}
  let req = requests.find(r => r.id === reqId);
  if (!req) return;

  const btn = document.getElementById("pres-btn-" + reqId);
  if (btn) { btn.textContent = "⏳ Building…"; btn.disabled = true; }

  // Wait for pptxgenjs to be available
  let tries = 0;
  while (typeof PptxGenJS === "undefined" && tries < 30) {
    await new Promise(r => setTimeout(r, 300));
    tries++;
  }
  if (typeof PptxGenJS === "undefined") {
    alert("PptxGenJS library not loaded. Please check your internet connection.");
    if (btn) { btn.textContent = "📊 Presentation"; btn.disabled = false; }
    return;
  }

  try {
    req = await preparePresentationRequest(req);
    const pres = new PptxGenJS();
    pres.layout = "LAYOUT_16x9";
    pres.author  = currentUser.name;
    pres.subject = "X-Section Report — " + req.id;
    pres.title   = req.id + " Cross-Section Report";

    const msgs = req.messages || [];
    const allMeas = msgs.flatMap(m => m.measurements || []);
    const allImgs = msgs.flatMap(m => m.images || []).filter(s => s.startsWith("data:"));

    const GREEN   = "76B900";
    const BLACK   = "1A1A1A";
    const DGRAY   = "2A2A2A";
    const MGRAY   = "444444";
    const LGRAY   = "888888";
    const WHITE   = "F0F0F0";
    const YELLOW  = "FFD700";
    const RED     = "E05555";

    // ── STATUS COLOR ──
    const statusColors = {open:"E0A020", progress:"378ADD", review:"9B7FE8", done:"76B900", closed:"666666"};
    const sColor = statusColors[req.status] || "888888";

    // ── SLIDE 1: COVER ────────────────────────────────────────────────────────
    {
      const sl = pres.addSlide();
      sl.background = { color: BLACK };

      // Green accent bar left edge
      sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

      // NVIDIA-style top strip
      sl.addShape(pres.ShapeType.rect, { x: 0.12, y: 0, w: 9.88, h: 0.08, fill: { color: GREEN } });

      // Title area
      sl.addText("CROSS-SECTION REPORT", {
        x: 0.35, y: 0.6, w: 9.3, h: 0.45,
        fontSize: 13, bold: true, color: GREEN,
        charSpacing: 4, isTextBox: true, margin: 0,
      });

      sl.addText(req.product, {
        x: 0.35, y: 1.1, w: 9.3, h: 0.7,
        fontSize: 34, bold: true, color: WHITE,
        isTextBox: true, margin: 0,
      });

      sl.addText(req.objective, {
        x: 0.35, y: 1.85, w: 9.3, h: 0.4,
        fontSize: 18, color: "AAAAAA",
        isTextBox: true, margin: 0,
      });

      // Divider
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 2.38, w: 9.3, h: 0.02, fill: { color: MGRAY } });

      // Info grid - left column
      const infoL = [
        ["Request ID",   req.id],
        ["Sample ID",    req.sampleId || "—"],
        ["Lot",          req.lot || "—"],
        ["Process stage",req.stage || "—"],
      ];
      infoL.forEach(([label, val], i) => {
        sl.addText(label, { x: 0.35, y: 2.5 + i * 0.42, w: 1.5, h: 0.35, fontSize: 9, color: LGRAY, bold: true, isTextBox: true, margin: 0 });
        sl.addText(val,   { x: 1.9,  y: 2.5 + i * 0.42, w: 3.6, h: 0.35, fontSize: 11, color: WHITE, isTextBox: true, margin: 0 });
      });

      // Info grid - right column
      const infoR = [
        ["Status",     (STATUS_CFG[req.status]?.label || req.status).toUpperCase()],
        ["Priority",   req.priority || "—"],
        ["Requester",  userName(req.requester)],
        ["Analyst",    req.analyst ? userName(req.analyst) : "—"],
      ];
      infoR.forEach(([label, val], i) => {
        sl.addText(label, { x: 5.6, y: 2.5 + i * 0.42, w: 1.5, h: 0.35, fontSize: 9, color: LGRAY, bold: true, isTextBox: true, margin: 0 });
        sl.addText(val,   { x: 7.1, y: 2.5 + i * 0.42, w: 2.7, h: 0.35, fontSize: 11, color: val === (STATUS_CFG[req.status]?.label || req.status).toUpperCase() ? sColor : WHITE, isTextBox: true, margin: 0 });
      });

      // Status badge
      sl.addShape(pres.ShapeType.rect, { x: 7.0, y: 4.85, w: 2.7, h: 0.55, fill: { color: DGRAY }, line: { color: sColor, pt: 1.5 }, rectRadius: 0.06 });
      sl.addText((STATUS_CFG[req.status]?.label || req.status).toUpperCase(), {
        x: 7.0, y: 4.85, w: 2.7, h: 0.55,
        fontSize: 12, bold: true, color: sColor,
        align: "center", valign: "middle", isTextBox: true, margin: 0,
      });

      // Date footer
      sl.addText("Generated: " + new Date().toLocaleDateString("en-GB", {day:"2-digit",month:"short",year:"numeric"}), {
        x: 0.35, y: 5.2, w: 6, h: 0.3, fontSize: 9, color: "555555", isTextBox: true, margin: 0,
      });

      sl.addNotes("Cover slide — " + req.id + " — " + req.product);
    }

    // ── SLIDE 2: REQUEST DETAILS ──────────────────────────────────────────────
    {
      const sl = pres.addSlide();
      sl.background = { color: BLACK };
      sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

      sl.addText("Request Details", { x: 0.35, y: 0.25, w: 9.3, h: 0.5, fontSize: 22, bold: true, color: WHITE, isTextBox: true, margin: 0 });
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.8, w: 9.3, h: 0.02, fill: { color: GREEN } });

      const details = [
        ["Product / Platform", req.product],
        ["Sample ID",          req.sampleId || "—"],
        ["Lot / Batch",        req.lot || "—"],
        ["Process Stage",      req.stage || "—"],
        ["Cut Plane",          req.cutPlane || "—"],
        ["Number of Cuts",     String(req.numCuts || 1)],
        ["Cut Location",       req.cutLocation || "—"],
        ["Objective",          req.objective || "—"],
        ["Magnification",      req.mag || "—"],
        ["Measurement",        req.measurement || "—"],
        ["Priority",           req.priority || "—"],
        ["Diagram Type",       DIAGRAMS.find(d => d.id === req.diagramType)?.label || req.diagramType || "—"],
      ];

      const col1 = details.slice(0, 6);
      const col2 = details.slice(6);

      col1.forEach(([label, val], i) => {
        sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.98 + i * 0.68, w: 4.5, h: 0.6, fill: { color: DGRAY }, line: { color: MGRAY, pt: 0.5 } });
        sl.addText(label, { x: 0.45, y: 1.0 + i * 0.68, w: 4.3, h: 0.22, fontSize: 8, color: GREEN, bold: true, isTextBox: true, margin: 0 });
        sl.addText(val,   { x: 0.45, y: 1.22 + i * 0.68, w: 4.3, h: 0.3, fontSize: 11, color: WHITE, isTextBox: true, margin: 0 });
      });

      col2.forEach(([label, val], i) => {
        sl.addShape(pres.ShapeType.rect, { x: 5.1, y: 0.98 + i * 0.68, w: 4.55, h: 0.6, fill: { color: DGRAY }, line: { color: MGRAY, pt: 0.5 } });
        sl.addText(label, { x: 5.2,  y: 1.0 + i * 0.68, w: 4.3, h: 0.22, fontSize: 8, color: GREEN, bold: true, isTextBox: true, margin: 0 });
        sl.addText(val,   { x: 5.2,  y: 1.22 + i * 0.68, w: 4.3, h: 0.3, fontSize: 11, color: WHITE, isTextBox: true, margin: 0 });
      });

      sl.addNotes("Request details for " + req.id);
    }

    // ── SLIDE 3: BACKGROUND ───────────────────────────────────────────────────
    if (req.background) {
      const sl = pres.addSlide();
      sl.background = { color: BLACK };
      sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

      sl.addText("Background & Failure Description", { x: 0.35, y: 0.25, w: 9.3, h: 0.5, fontSize: 22, bold: true, color: WHITE, isTextBox: true, margin: 0 });
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.8, w: 9.3, h: 0.02, fill: { color: GREEN } });

      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 1.0, w: 9.3, h: 3.8, fill: { color: DGRAY }, line: { color: MGRAY, pt: 0.5 } });
      sl.addText(req.background, {
        x: 0.55, y: 1.15, w: 9.0, h: 3.5,
        fontSize: 14, color: WHITE,
        valign: "top", isTextBox: true, margin: 0,
        wrap: true,
      });

      sl.addNotes("Background: " + req.background);
    }

    // ── SLIDE 4: CUT DIAGRAM ─────────────────────────────────────────────────
    {
      const sl = pres.addSlide();
      sl.background = { color: BLACK };
      sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

      sl.addText("Cut Diagram — " + (DIAGRAMS.find(d => d.id === req.diagramType)?.label || "Standard"), {
        x: 0.35, y: 0.25, w: 9.3, h: 0.5, fontSize: 22, bold: true, color: WHITE, isTextBox: true, margin: 0,
      });
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.8, w: 9.3, h: 0.02, fill: { color: GREEN } });

      // Diagram description box
      const diagInfo = DIAGRAMS.find(d => d.id === req.diagramType);
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.95, w: 9.3, h: 0.5, fill: { color: DGRAY }, line: { color: MGRAY, pt: 0.5 } });
      sl.addText((diagInfo?.desc || "") + "  ·  " + req.numCuts + " cut" + (req.numCuts > 1 ? "s" : "") + "  ·  " + (req.cutPlane || ""), {
        x: 0.5, y: 0.97, w: 9.0, h: 0.46, fontSize: 12, color: "AAAAAA", isTextBox: true, margin: 0,
      });

      // Package cross-section diagram (drawn with shapes)
      const DX = 1.2, DY = 1.65, DW = 7.6, DH = 3.4;

      // Outer border
      sl.addShape(pres.ShapeType.rect, { x: DX, y: DY, w: DW, h: DH, fill: { color: "1A1A1A" }, line: { color: MGRAY, pt: 1 } });

      // Lid
      sl.addShape(pres.ShapeType.rect, { x: DX+0.2, y: DY+0.1, w: DW-0.4, h: 0.55, fill: { color: "333333" }, line: { color: "666666", pt: 0.8 } });
      sl.addText("Lid / heat spreader", { x: DX+0.2, y: DY+0.1, w: DW-0.4, h: 0.55, fontSize: 10, color: LGRAY, align: "center", valign: "middle", isTextBox: true, margin: 0 });

      // TIM1
      sl.addShape(pres.ShapeType.rect, { x: DX+0.4, y: DY+0.65, w: DW-0.8, h: 0.35, fill: { color: "1e2e00" }, line: { color: GREEN, pt: 0.8 } });
      sl.addText("TIM1", { x: DX+0.4, y: DY+0.65, w: DW-0.8, h: 0.35, fontSize: 9, color: GREEN, align: "center", valign: "middle", isTextBox: true, margin: 0 });

      // Die
      sl.addShape(pres.ShapeType.rect, { x: DX+0.5, y: DY+1.0, w: DW-1.0, h: 1.2, fill: { color: "222222" }, line: { color: "666666", pt: 1 } });
      sl.addText("Die", { x: DX+0.5, y: DY+1.0, w: DW-1.0, h: 1.2, fontSize: 18, bold: true, color: "CCCCCC", align: "center", valign: "middle", isTextBox: true, margin: 0 });

      // Underfill
      sl.addShape(pres.ShapeType.rect, { x: DX+0.4, y: DY+2.2, w: DW-0.8, h: 0.25, fill: { color: "0e2010" }, line: { color: "4caf50", pt: 0.5 } });

      sl.addShape(pres.ShapeType.rect, { x: DX+0.2, y: DY+2.45, w: DW-0.4, h: 0.55, fill: { color: "333333" }, line: { color: "666666", pt: 0.8 } });
      sl.addText("Substrate / PCB", { x: DX+0.2, y: DY+2.45, w: DW-0.4, h: 0.55, fontSize: 10, color: LGRAY, align: "center", valign: "middle", isTextBox: true, margin: 0 });

      // Cut lines
      const numCuts = req.numCuts || 1;
      const cutColors = ["4A90D9", "E0A020", "E05555", "9B7FE8", "4caf50", "FF8C00"];
      for (let c = 0; c < Math.min(numCuts, 6); c++) {
        const cx = DX + 0.6 + (c + 1) * ((DW - 1.2) / (numCuts + 1));
        const cc = cutColors[c];
        sl.addShape(pres.ShapeType.line, { x: cx, y: DY, w: 0, h: DH, line: { color: cc, pt: 1.5, dashType: "dash" } });
        sl.addText("Cut " + (c + 1), { x: cx - 0.3, y: DY - 0.28, w: 0.6, h: 0.22, fontSize: 8, bold: true, color: cc, align: "center", isTextBox: true, margin: 0 });

      // Axes
      sl.addText("Z ↑", { x: DX - 0.18, y: DY + DH/2 - 0.15, w: 0.3, h: 0.3, fontSize: 9, color: "555555", isTextBox: true, margin: 0 });
      sl.addText("X →", { x: DX + DW + 0.02, y: DY + DH - 0.25, w: 0.3, h: 0.25, fontSize: 9, color: "555555", isTextBox: true, margin: 0 });

      sl.addText("Cut location: " + (req.cutLocation || "—"), {
        x: 0.35, y: 5.2, w: 9.3, h: 0.3, fontSize: 9, color: "555555", isTextBox: true, margin: 0,
      });

      sl.addNotes("Cut diagram: " + (req.cutPlane || "") + " — " + (req.cutLocation || ""));
    }

    // ── SLIDES 5+: THREAD MESSAGES ────────────────────────────────────────────
    if (msgs.length > 0) {
      msgs.forEach((msg, idx) => {
        const sl = pres.addSlide();

        const u = KNOWN_USERS.find(x => x.id === msg.author) || { name: msg.author, initials: (msg.author || "?").slice(0, 2).toUpperCase() };

        sl.addText("Analysis Thread — Message " + (idx + 1) + " of " + msgs.length, {
          x: 0.35, y: 0.25, w: 9.3, h: 0.4, fontSize: 18, bold: true, color: WHITE, isTextBox: true, margin: 0,

        // Author header

        sl.addText(msg.ts ? msg.ts.slice(0, 16).replace("T", " ") : "", { x: 0.5, y: 1.1, w: 5, h: 0.2, fontSize: 9, color: LGRAY, isTextBox: true, margin: 0 });
        sl.addText(req.analyst === msg.author ? "ANALYST" : "REQUESTER", { x: 8.0, y: 0.9, w: 1.5, h: 0.3, fontSize: 9, bold: true, color: req.analyst === msg.author ? GREEN : "378ADD", align: "right", isTextBox: true, margin: 0 });

        // Message text
        const hasImgs = msg.images?.some(s => s.startsWith("data:"));
        const textW = hasImgs ? 5.6 : 9.3;

        sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 1.44, w: textW, h: 2.6, fill: { color: "1e1e1e" }, line: { color: MGRAY, pt: 0.5 } });
        sl.addText(msg.text || "", {
          x: 0.5, y: 1.5, w: textW - 0.3, h: 2.5,
          fontSize: 12, color: WHITE, valign: "top", wrap: true, isTextBox: true, margin: 0,
        });

        // Image placeholder (if any images)
        if (hasImgs) {
          const imgSrc = msg.images.find(s => s.startsWith("data:"));
          try {
            sl.addImage({ data: imgSrc, x: 6.1, y: 1.44, w: 3.5, h: 2.6 });
          } catch(e) {
            sl.addShape(pres.ShapeType.rect, { x: 6.1, y: 1.44, w: 3.5, h: 2.6, fill: { color: DGRAY }, line: { color: MGRAY, pt: 0.5 } });
            sl.addText("📷 Image attached\n(" + msg.images.length + " image" + (msg.images.length > 1 ? "s" : "") + ")", { x: 6.1, y: 1.44, w: 3.5, h: 2.6, fontSize: 12, color: LGRAY, align: "center", valign: "middle", isTextBox: true, margin: 0 });
          }
        }

        // Measurements
        if (msg.measurements?.length > 0) {
          sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 4.15, w: 9.3, h: 0.02, fill: { color: MGRAY } });
          sl.addText("Measurements:", { x: 0.35, y: 4.22, w: 1.6, h: 0.28, fontSize: 9, bold: true, color: GREEN, isTextBox: true, margin: 0 });
          sl.addText(msg.measurements.join("   ·   "), {
            x: 1.9, y: 4.22, w: 7.7, h: 0.28, fontSize: 10, color: "CCCCCC", isTextBox: true, margin: 0,
          });
        }

        sl.addNotes("Message from " + u.name + ": " + (msg.text || "").slice(0, 200));
      });
    }

    // ── SLIDE: MEASUREMENTS SUMMARY ───────────────────────────────────────────
    if (allMeas.length > 0) {
      const sl = pres.addSlide();
      sl.background = { color: BLACK };
      sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

      sl.addText("Key Measurements Summary", { x: 0.35, y: 0.25, w: 9.3, h: 0.5, fontSize: 22, bold: true, color: WHITE, isTextBox: true, margin: 0 });
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.8, w: 9.3, h: 0.02, fill: { color: GREEN } });

      allMeas.slice(0, 12).forEach((meas, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const x = 0.35 + col * 4.75;
        const y = 1.0 + row * 0.88;
        const w = 4.55;
        sl.addShape(pres.ShapeType.rect, { x, y, w, h: 0.78, fill: { color: DGRAY }, line: { color: GREEN, pt: 0.8 } });
        sl.addText("📏", { x: x + 0.1, y: y + 0.22, w: 0.35, h: 0.35, fontSize: 14, isTextBox: true, margin: 0 });
        sl.addText(meas, { x: x + 0.45, y: y + 0.12, w: w - 0.55, h: 0.56, fontSize: 13, color: WHITE, valign: "middle", wrap: true, isTextBox: true, margin: 0 });
      });

      if (allMeas.length > 12) {
        sl.addText("+ " + (allMeas.length - 12) + " more measurements in thread", {
          x: 0.35, y: 5.2, w: 9.3, h: 0.28, fontSize: 9, color: LGRAY, isTextBox: true, margin: 0,
        });
      }

      sl.addNotes("All measurements: " + allMeas.join(", "));
    }

    // ── SLIDE: IMAGE GALLERY (if images present) ──────────────────────────────
    if (allImgs.length > 0) {
      const perSlide = 4;
      const pages = Math.ceil(allImgs.length / perSlide);
      for (let p = 0; p < pages; p++) {
        const sl = pres.addSlide();
        sl.background = { color: BLACK };
        sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

        sl.addText("Images" + (pages > 1 ? " (" + (p + 1) + "/" + pages + ")" : ""), {
          x: 0.35, y: 0.25, w: 9.3, h: 0.5, fontSize: 22, bold: true, color: WHITE, isTextBox: true, margin: 0,
        });
        sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.8, w: 9.3, h: 0.02, fill: { color: GREEN } });

        const batch = allImgs.slice(p * perSlide, (p + 1) * perSlide);
        const positions = [
          { x: 0.35, y: 0.95, w: 4.55, h: 2.2 },
          { x: 5.1,  y: 0.95, w: 4.55, h: 2.2 },
          { x: 0.35, y: 3.25, w: 4.55, h: 2.2 },
          { x: 5.1,  y: 3.25, w: 4.55, h: 2.2 },
        ];
        batch.forEach((img, i) => {
          const pos = positions[i];
          try {
            sl.addImage({ data: img, ...pos });
          } catch(e) {
            sl.addShape(pres.ShapeType.rect, { ...pos, fill: { color: DGRAY }, line: { color: MGRAY, pt: 0.5 } });
            sl.addText("Image " + (p * perSlide + i + 1), { ...pos, fontSize: 12, color: LGRAY, align: "center", valign: "middle", isTextBox: true, margin: 0 });
          }
        });
        sl.addNotes("Image gallery page " + (p + 1));
      }
    }

    // ── LAST SLIDE: CONCLUSION / STATUS ───────────────────────────────────────
    {
      const sl = pres.addSlide();
      sl.background = { color: BLACK };
      sl.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 0.12, h: 5.625, fill: { color: GREEN } });

      sl.addText("Conclusion & Status", { x: 0.35, y: 0.25, w: 9.3, h: 0.5, fontSize: 22, bold: true, color: WHITE, isTextBox: true, margin: 0 });
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.8, w: 9.3, h: 0.02, fill: { color: GREEN } });

      // Status summary box
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 0.95, w: 9.3, h: 1.0, fill: { color: DGRAY }, line: { color: sColor, pt: 1.5 } });
      sl.addText("Final Status", { x: 0.6, y: 1.0, w: 3, h: 0.35, fontSize: 9, bold: true, color: LGRAY, isTextBox: true, margin: 0 });
      sl.addText((STATUS_CFG[req.status]?.label || req.status).toUpperCase(), {
        x: 0.6, y: 1.35, w: 4, h: 0.45, fontSize: 22, bold: true, color: sColor, isTextBox: true, margin: 0,
      });
      sl.addText(allMeas.length + " measurements recorded", { x: 5.5, y: 1.0, w: 4, h: 0.35, fontSize: 11, color: LGRAY, isTextBox: true, margin: 0 });
      sl.addText(msgs.length + " thread messages", { x: 5.5, y: 1.38, w: 4, h: 0.35, fontSize: 11, color: LGRAY, isTextBox: true, margin: 0 });

      // Last message as conclusion
      const lastMsg = msgs[msgs.length - 1];
      if (lastMsg) {
        sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 2.1, w: 9.3, h: 2.4, fill: { color: "1A2800" }, line: { color: GREEN, pt: 0.8 } });
        sl.addText(req.results ? "Conclusion and summary:" : "Last update:", { x: 0.55, y: 2.18, w: 9.0, h: 0.28, fontSize: 9, bold: true, color: GREEN, isTextBox: true, margin: 0 });
        const lu = KNOWN_USERS.find(x => x.id === lastMsg.author);
        sl.addText((lu?.name || lastMsg.author) + " — " + (lastMsg.ts || "").slice(0, 10), {
          x: 0.55, y: 2.46, w: 9.0, h: 0.28, fontSize: 9, color: LGRAY, isTextBox: true, margin: 0,
        });
        sl.addText(lastMsg.text || "", {
          x: 0.55, y: 2.78, w: 9.0, h: 1.6, fontSize: 12, color: WHITE, wrap: true, valign: "top", isTextBox: true, margin: 0,
        });
      }

      // Footer
      sl.addShape(pres.ShapeType.rect, { x: 0.35, y: 4.85, w: 9.3, h: 0.02, fill: { color: MGRAY } });
      sl.addText("X-Section Lab · NVIDIA Israel · " + req.id + " · " + new Date().toLocaleDateString("en-GB", {day:"2-digit",month:"short",year:"numeric"}), {
        x: 0.35, y: 4.92, w: 9.3, h: 0.28, fontSize: 9, color: "444444", isTextBox: true, margin: 0,
      });

      sl.addNotes("Conclusion slide for " + req.id);
    }

    // ── SAVE ──────────────────────────────────────────────────────────────────
    const filename = req.id + "_XSection_Report_" + new Date().toISOString().slice(0,10) + ".pptx";
    await pres.writeFile({ fileName: filename });
    showToast("📊 " + filename + " downloaded!");
  } catch(err) {
    console.error("Presentation error:", err);
    alert("Error generating presentation: " + err.message);
  }

  if (btn) { btn.textContent = "📊 Presentation"; btn.disabled = false; }
}

function escapeView(value){if(typeof value==='string')return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(Array.isArray(value))return value.map(escapeView);if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,escapeView(v)]));return value;}
function safeRender(fn){return function(...args){const raw=requests,person=currentUser;requests=escapeView(raw);currentUser=escapeView(person);try{return fn.apply(this,args);}finally{requests=raw;currentUser=person;}};}
renderDashboard=safeRender(renderDashboard);renderRequests=safeRender(renderRequests);renderDetail=safeRender(renderDetail);renderNew=safeRender(renderNew);editReqModal=safeRender(editReqModal);
